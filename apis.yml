apis:
- aid: seventh-sense:seventh-sense-collections-api
  name: Seventh Sense Collections API
  description: >-
    Collections are groups of registered `Persons`. You can use collections to organize your registered
    persons and to search for persons within a specific collection. You can also use collections to manage
    access to your registered persons. For example, you can create a collection for each of your customers/organization
    sub-units and only allow them to search for persons in their own collection.
  humanURL: https://us.opencv.fr/docs
  baseURL: https://us.opencv.fr
  tags:
  - Collection
  tags_raw:
  - Collections

name: Seventh Sense
description: >-
  Seventh Sense AI is a Singapore-based deep-tech company building privacy-preserving,
  face-based identity and biometric verification technology. Its OpenCV Face Recognition
  (OpenCV FR) platform — ranked among the top 10 facial recognition algorithms globally by
  NIST — provides face detection, matching, liveness detection, search and person/collection
  management through a multi-region REST API and Python/C++ SDKs. Seventh Sense also develops
  the SenseCrypt suite (eID, PKI and self-sovereign identity built on distributed ledgers,
  "0% biometrics, 100% privacy") and SenseVantage multimodal video AI. The company is SOC,
  ISO 27001 certified and GDPR compliant, serving enterprise and government customers.

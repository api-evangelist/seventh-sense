  - type: APIReference
    url: https://us.opencv.fr/docs
- aid: seventh-sense:seventh-sense-face-anti-spoofing-liveness-api
  name: Seventh Sense Face Anti-Spoofing / Liveness API
  description: >-
    The `/liveness` endpoint allows you to determine if a face image is of a real person or a spoofed
    image (eg. a printed image of a face, or an image captured from a tablet's screen). The endpoint returns
    a score between 0 and 1, where 1 is a real person and 0 is a spoofed image, the threshold for the
    image to be considered live is >= 0.5.<br/><br/> Our liveness achieved Attack Presentation Classification
    Error Rate (APCER) of 0% and reached iBeta Level 2 compliance in accordance with ISO 30107-3. <br/><br/>**Note:**
    The `/liveness` endpoint does not store any information on our servers. It is a one-time classification
    of an image using a deep learning model. If you want to store the images and search for them later,
    use the `/person` endpoint to register persons for a later search using the `/search` endpoint.<br/><br/>To
    ensure fraudsters cannot use high-resolution print outs, masks or video playbacks to spoof face recognition
    systems, liveness image has a higher requirement on image:<br/><br/>Liveness image requirement:<br/>
    <ul> <li>There should only be one main face on the image. It should be fully visible within a frame
    and fully open without any occlusions. No crop is allowed. Small faces in the background are not taken
    into account.</li> <li>The minimum size of a face box that can be processed is 224x224 pixels.</li>
    <li>The padding between the face box and the image's borders should be at least 25 pixels.</li> <li>The
    distance between the pupils on the face should be at least 80 pixels.</li> <li>The out-of-plane rotation
    angle (face pitch and yaw) should be no more than ±30 degrees.</li> <li>Fish-eye lenses and sunglass
    images are not supported.</li> </ul>
  humanURL: https://us.opencv.fr/docs
  baseURL: https://us.opencv.fr
  tags:
  - Face Anti-Spoofing / Liveness
  properties:
  - type: OpenAPI
    url: openapi/seventh-sense-face-anti-spoofing-liveness-api-openapi.yml
  - type: Documentation
    url: https://docs.opencv.fr
  - type: APIReference
    url: https://us.opencv.fr/docs
- aid: seventh-sense:seventh-sense-face-verification-api
  name: Seventh Sense Face Verification API
  description: >-
    The `/compare` endpoint allows you to compare two sets of face images to determine if they correspond
    to the same person. A score higher than 0.81 is a good indicator that the two sets of images belong
    to the same person. You can also use a score of 0.75 or higher if the images are of the same person
    but taken at different times (years apart). The score is a number between 0 and 1, where 1 is a perfect
    match and 0 is a perfect mismatch. The score is calculated using a deep learning model trained on
    millions of face images. <br/><br/>**Note:** The `/compare` endpoint does not store any information
    on our servers. It is a one-time comparison of two sets of images. If you want to store the images
    and search for them later, use the `/person` endpoints to manage persons for a later search using
    the `/search` endpoint.
  humanURL: https://us.opencv.fr/docs
  baseURL: https://us.opencv.fr
  tags:
  - Face Verification
  properties:
  - type: OpenAPI
    url: openapi/seventh-sense-face-verification-api-openapi.yml
  - type: Documentation
    url: https://docs.opencv.fr
  - type: APIReference
    url: https://us.opencv.fr/docs
- aid: seventh-sense:seventh-sense-persons-api
  name: Seventh Sense Persons API
  description: >-
    Persons are registered persons that you can later search for using face images. Registering a person
    allows you to search for them later using the `/search` endpoint. You can also use the `/person` endpoint(s)
    to update the registered person's name and/or add additional images to the registered person. Registering
    a person stores thumbnail face images and information on our servers. You can delete a registered
    person using the `DELETE /person/{person_id}` endpoint.
  humanURL: https://us.opencv.fr/docs
  baseURL: https://us.opencv.fr
  tags:
  - Persons
  properties:
  - type: OpenAPI
    url: openapi/seventh-sense-persons-api-openapi.yml
  - type: Documentation
    url: https://docs.opencv.fr
  - type: APIReference
    url: https://us.opencv.fr/docs
- aid: seventh-sense:seventh-sense-search-api
  name: Seventh Sense Search API
  description: >-
    The endpoints below allow you to search for previously registered persons using a face image obtained
    at a later time. The search is performed using a deep learning model trained on millions of face images.
    The search results are ranked by the similarity score, which is a number between 0 and 1, where 1
    is a perfect match and 0 is a perfect mismatch. The search results are returned in order of decreasing
    similarity score, but above the specified `min_score` threshold (default is 0.81). The `max_results`
    parameter is optional and allows you to control the maximum number of returned results. By default,
    it is set to 10, but you can customize this number for your specific use case. The maximum value you
    can set is 100.<br/><br/>**Note:** The `/search` endpoint does not store any information on our servers.
    It is a one-time search of a set of images against registered persons. If you want to store the images
    and search for them later, use the `/person` endpoint to register persons for a later search using
    the endpoints below.
  humanURL: https://us.opencv.fr/docs
  baseURL: https://us.opencv.fr
  tags:
  - Search
  properties:
  - type: OpenAPI
    url: openapi/seventh-sense-search-api-openapi.yml
  - type: Documentation
    url: https://docs.opencv.fr
  - type: APIReference
    url: https://us.opencv.fr/docs
